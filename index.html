<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Website Has Been Taken</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    position: relative;
  }

  canvas#matrix {
    position: fixed;
    top: 0; left: 0;
    z-index: 0;
    opacity: 0.5;
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
  }

  .scanline {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,255,70,0.03) 0px,
      rgba(0,255,70,0.03) 1px,
      transparent 2px,
      transparent 4px
    );
    z-index: 3;
    pointer-events: none;
  }

  h1 {
    font-size: clamp(1.6rem, 6vw, 3.5rem);
    color: #0f0;
    text-transform: uppercase;
    letter-spacing: 3px;
    position: relative;
    text-shadow:
      0 0 10px #0f0,
      0 0 20px #0f0,
      0 0 40px #0f0;
    animation: flicker 3s infinite;
  }

  h1::before,
  h1::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    overflow: hidden;
    background: black;
  }

  h1::before {
    left: 2px;
    text-shadow: -2px 0 #ff003c;
    clip-path: inset(0 0 0 0);
    animation: glitchTop 2.5s infinite linear alternate-reverse;
  }

  h1::after {
    left: -2px;
    text-shadow: -2px 0 #00e5ff, 2px 2px #ff003c;
    clip-path: inset(0 0 0 0);
    animation: glitchBottom 3s infinite linear alternate-reverse;
  }

  @keyframes glitchTop {
    0%   { clip-path: inset(0 0 85% 0); transform: translate(-2px,-1px); }
    20%  { clip-path: inset(10% 0 60% 0); transform: translate(2px,1px); }
    40%  { clip-path: inset(40% 0 30% 0); transform: translate(-1px,2px); }
    60%  { clip-path: inset(60% 0 10% 0); transform: translate(1px,-2px); }
    80%  { clip-path: inset(20% 0 70% 0); transform: translate(-2px,1px); }
    100% { clip-path: inset(0 0 90% 0); transform: translate(2px,-1px); }
  }

  @keyframes glitchBottom {
    0%   { clip-path: inset(85% 0 0 0); transform: translate(2px,1px); }
    20%  { clip-path: inset(60% 0 10% 0); transform: translate(-2px,-1px); }
    40%  { clip-path: inset(30% 0 40% 0); transform: translate(1px,-2px); }
    60%  { clip-path: inset(10% 0 60% 0); transform: translate(-1px,2px); }
    80%  { clip-path: inset(70% 0 20% 0); transform: translate(2px,-1px); }
    100% { clip-path: inset(90% 0 0 0); transform: translate(-2px,1px); }
  }

  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 22%, 24%, 55% { opacity: 0.4; }
  }

  .sub {
    margin-top: 1.2rem;
    color: #0f0;
    font-size: clamp(0.8rem, 2vw, 1.1rem);
    opacity: 0.8;
    letter-spacing: 2px;
  }

  .sub::after {
    content: '_';
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="scanline"></div>
  <div class="content">
    <h1 data-text="YOUR WEBSITE HAS BEEN TAKEN">YOUR WEBSITE HAS BEEN TAKEN</h1>
    <div class="sub">SYSTEM COMPROMISED // ACCESS REDIRECTED</div>
  </div>

<script>
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const chars = 'アイウエオカキクケコサシスセソ01アイウエオ$#@%&';
  const fontSize = 16;
  const columns = Math.floor(canvas.width / fontSize);
  const drops = Array(columns).fill(1);

  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0f0';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(draw, 40);

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>
</body>
</html>
